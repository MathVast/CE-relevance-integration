[project]
name = "relevance_integration"
version = "0.0.1"
requires-python = ">=3.9,<3.12"

dependencies = [
    "datamaestro>=1.5.2",
    "datamaestro-text",
    "experimaestro>=1.15.1",
    "experimaestro-ir[anserini,neural]",
    "tensorboard",
    "torch>=2.6.0",
    "numpy<2",
    "pandas>=2.2.3",
    "ir-datasets<0.5.9",
    "transformers=4.56.2",
    "scikit-learn>=1.6.1",
    "scipy>=1.12.0",
    "ir_measures>=0.3.7"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src",
]

[tool.hatch.build]
dev-mode-dirs = ["."]


